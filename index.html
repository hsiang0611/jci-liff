<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <!-- 更新網站檔案時，把下面所有 ?v= 後面的版本號一起改掉，手機才會抓新檔（與 app.js 的 APP_VERSION 相同）。
       上傳時把 index.html、css、js 一次拖進去；要分開傳的話，index.html 最後傳。 -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A3D6B">
  <meta name="format-detection" content="telephone=no">
  <title>龍井國際青年商會 會員專區</title>
  <link rel="icon" href="img/logo.png">
  <link rel="apple-touch-icon" href="img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/app.css?v=2026.10.23.7">
</head>
<body>
  <div id="app" class="app"><p style="padding:24px;color:#7B8594">載入中…</p></div>
  <nav id="tabbar" class="tabbar" aria-label="主選單" hidden></nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="layer" class="layer" hidden></div>

  <script src="js/config.js?v=2026.10.23.7"></script>
  <script src="js/mock.js?v=2026.10.23.7"></script>
  <script src="js/api.js?v=2026.10.23.7"></script>
  <script src="js/app.js?v=2026.10.23.7"></script>
  <script>
    // 自我檢查：檔案沒上傳完整或 config.js 打錯字時，顯示原因而不是空白頁
    setTimeout(function () {
      if (window.__appStarted && window.Api) return;
      var missing = [];
      if (!window.APP_CONFIG) missing.push('js/config.js（檔案不存在，或內容打錯字：例如全形引號、少了逗號）');
      if (!window.Mock) missing.push('js/mock.js');
      if (!window.Api) missing.push('js/api.js');
      if (!window.__appStarted) missing.push('js/app.js');
      document.getElementById('app').innerHTML =
        '<div style="padding:24px;font:16px/1.7 sans-serif;color:#13243A">' +
        '<p style="font-size:18px;font-weight:700;margin:0 0 8px">網頁檔案不完整，無法啟動</p>' +
        '<p style="margin:0 0 8px">讀取失敗：</p><ul style="margin:0 0 12px;padding-left:20px"><li>' + missing.join('</li><li>') + '</li></ul>' +
        '<p style="margin:0;color:#44505F">請確認網站上 index.html 旁邊有 <b>css</b>、<b>js</b>、<b>img</b> 三個資料夾，裡面各有檔案。</p></div>';
    }, 5000);
  </script>
</body>
</html>

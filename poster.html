<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>招募海報</title>
  <link rel="icon" href="img/logo.png">
  <style>
    :root { --ink: #13243A; --ink-2: #44505F; --harbor: #0567B1; --deep: #0A3D6B; --tide: #E5EFF8; --buoy: #D9500B; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #DDE3EA; color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
    .bar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center;
      padding: 10px 12px; background: rgba(255,255,255,.95); border-bottom: 1px solid #D3DAE3; font-size: 14px; }
    .bar button { font: inherit; border: 1px solid #C9D2DD; background: #fff; border-radius: 999px; padding: 6px 14px; cursor: pointer; }
    .bar button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
    .bar .print { background: var(--harbor); border-color: var(--harbor); color: #fff; font-weight: 700; }
    .note { width: 100%; text-align: center; color: #7B4E00; font-size: 13px; }
    .stage { padding: 16px; display: flex; justify-content: center; overflow: hidden; }
    /* A4：210 × 297 mm，畫面上等比縮小 */
    .page { flex: none; width: 210mm; height: 297mm; background: #fff; position: relative; overflow: hidden;
      box-shadow: 0 10px 30px -12px rgba(10,61,107,.45); display: flex; flex-direction: column; }
    .top { flex: none; background: var(--deep); color: #fff; padding: 14mm 16mm 11mm; position: relative; overflow: hidden; }
    .top svg.waves { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .32; }
    .org { position: relative; display: flex; align-items: center; gap: 5mm; font-size: 6.2mm; font-weight: 700; letter-spacing: .12em; }
    .org img { height: 16mm; width: auto; }
    h1 { position: relative; margin: 9mm 0 0; font-size: 13mm; line-height: 1.18; letter-spacing: .06em; font-weight: 900; }
    .sub { position: relative; margin: 4mm 0 0; font-size: 5.2mm; line-height: 1.6; opacity: .92; max-width: 170mm; }
    .mid { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6mm 16mm 4mm; }
    .qr { width: 84mm; height: 84mm; padding: 4mm; border: 1.2mm solid var(--deep); border-radius: 6mm; background: #fff; }
    .qr svg { width: 100%; height: 100%; display: block; }
    .scan { margin-top: 7mm; font-size: 7.4mm; font-weight: 800; color: var(--deep); letter-spacing: .08em; display: flex; align-items: center; gap: 3mm; }
    .scan b { background: #06C755; color: #fff; padding: 1mm 3.4mm; border-radius: 2.4mm; font-size: 6mm; letter-spacing: .02em; }
    .url { margin-top: 3mm; font-size: 3.6mm; color: var(--ink-2); word-break: break-all; text-align: center; }
    .points { flex: none; list-style: none; margin: 0; padding: 0 16mm 8mm; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4mm; }
    .points li { background: var(--tide); border-radius: 4mm; padding: 5mm 3mm; text-align: center; font-size: 4.3mm; font-weight: 700; color: var(--deep); line-height: 1.45; }
    .points svg { display: block; margin: 0 auto 2mm; width: 9mm; height: 9mm; color: var(--harbor); }
    .foot { flex: none; padding: 5mm 16mm 8mm; border-top: 0.6mm solid var(--tide); display: flex; justify-content: space-between; align-items: center; font-size: 4.2mm; color: var(--ink-2); }
    .foot b { color: var(--deep); letter-spacing: .06em; }
    @media screen and (max-width: 840px) {
      .stage { padding: 12px 0 24px; }
      .page { transform-origin: top center; }
    }
    @page { size: A4; margin: 0; }
    @media print {
      html, body { background: #fff; }
      .bar { display: none; }
      .stage { padding: 0; }
      .page { box-shadow: none; transform: none !important; margin: 0 !important; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <div class="bar" role="toolbar" aria-label="海報設定">
    <button type="button" data-type="join">招募新朋友</button>
    <button type="button" data-type="member">會員綁定</button>
    <button type="button" class="print" onclick="window.print()">列印／存成 PDF</button>
    <p class="note" id="note" hidden></p>
  </div>
  <div class="stage"><div class="page" id="page"></div></div>

  <script src="js/config.js"></script>
  <script src="js/qrcode.js"></script>
  <script>
  (function () {
    'use strict';
    var CFG = window.APP_CONFIG || {};
    var demo = !CFG.LIFF_ID || !CFG.API_URL || CFG.DEMO;
    var TYPES = {
      join: {
        to: 'join', title: '認識<br>' + (CFG.ORG_SHORT || '龍井青商'),
        sub: '40 歲以下的青年，一起做公益、學領導、交朋友。<br>掃描看看近期的公開活動，歡迎一起來！'
      },
      member: {
        to: 'me', title: '會員專區',
        sub: '會員掃描後，用姓名與手機完成綁定，<br>就能報名活動、看通訊錄、收到會務通知。'
      }
    };
    var ICON = {
      users: '<circle cx="9" cy="8.5" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 5a3.5 3.5 0 0 1 0 7M18 14.2a6.5 6.5 0 0 1 3.5 5.8"/>',
      flag: '<path d="M5.5 21V4M5.5 4h11l-2 4 2 4h-11"/>',
      chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
      share: '<circle cx="18" cy="5.5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="18.5" r="2.5"/><path d="m8.2 10.8 7.6-4.1M8.2 13.2l7.6 4.1"/>'
    };
    function icon(n) {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + ICON[n] + '</svg>';
    }
    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
    }
    function waves() {
      var p = '';
      for (var i = 0; i < 9; i++) {
        var y = 20 + i * 26, a = 6 + (i % 3) * 5, o = i * 41;
        p += '<path d="M-20 ' + y + ' C ' + (70 + o % 60) + ' ' + (y - a) + ', ' + (160 + o % 50) + ' ' + (y + a * 1.5) + ', 260 ' + (y + 2) +
          ' S ' + (380 - o % 40) + ' ' + (y - a) + ', 520 ' + (y + a * .5) + '" fill="none" stroke="#5FA8E0" stroke-width="1.2"/>';
      }
      return '<svg class="waves" viewBox="0 0 500 260" preserveAspectRatio="none" aria-hidden="true">' + p + '</svg>';
    }
    function linkFor(to) {
      if (demo) return new URL('index.html#/' + to, location.href).toString();
      return 'https://liff.line.me/' + CFG.LIFF_ID + '?to=' + encodeURIComponent(to);
    }
    function qr(text) {
      var q = window.qrcode(0, 'M');
      q.addData(text);
      q.make();
      return q.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
    }
    function render(type) {
      var t = TYPES[type] || TYPES.join;
      var url = linkFor(t.to);
      document.getElementById('page').innerHTML =
        '<section class="top">' + waves() + '<div class="org"><img src="img/logo.png" alt="" onerror="this.hidden=true">' + esc(CFG.ORG_NAME || '') + '</div>' +
        '<h1>' + t.title + '</h1><p class="sub">' + t.sub + '</p></section>' +
        '<section class="mid"><div class="qr">' + qr(url) + '</div><div class="scan">用 <b>LINE</b> 掃描</div><div class="url">' + esc(url) + '</div></section>' +
        (type === 'join' ? '<ul class="points">' + [['users', '認識各行各業<br>的朋友'], ['flag', '公益服務<br>回饋地方'], ['chart', '領導力<br>自我成長'], ['share', '國際交流<br>姊妹會']].map(function (x) {
          return '<li>' + icon(x[0]) + x[1] + '</li>';
        }).join('') + '</ul>' : '') +
        '<footer class="foot"><b>' + esc(CFG.ORG_NAME || '') + '</b><span>' + (CFG.OA_BASIC_ID ? 'LINE 官方帳號 ' + esc(CFG.OA_BASIC_ID) : 'JCI Longjing') + '</span></footer>';
      Array.prototype.forEach.call(document.querySelectorAll('[data-type]'), function (b) {
        b.setAttribute('aria-pressed', String(b.getAttribute('data-type') === type));
      });
      var note = document.getElementById('note');
      note.hidden = !demo;
      note.textContent = '示範模式：正式上線（config.js 填好 LIFF_ID）後，QR code 會連到 LINE 會員專區。';
      fit();
    }
    function fit() {
      var page = document.getElementById('page');
      var w = page.offsetWidth, avail = document.documentElement.clientWidth - 24;
      var s = Math.min(1, avail / w);
      page.style.transform = s < 1 ? 'scale(' + s + ')' : '';
      page.style.marginBottom = s < 1 ? (-(1 - s) * page.offsetHeight) + 'px' : '';
    }
    var type = new URLSearchParams(location.search).get('type') === 'member' ? 'member' : 'join';
    document.addEventListener('click', function (e) {
      var b = e.target.closest('[data-type]');
      if (!b) return;
      type = b.getAttribute('data-type');
      history.replaceState(null, '', '?type=' + type);
      render(type);
    });
    window.addEventListener('resize', fit);
    window.addEventListener('beforeprint', function () { var p = document.getElementById('page'); p.style.transform = ''; p.style.marginBottom = ''; });
    window.addEventListener('afterprint', fit);
    render(type);
  })();
  </script>
</body>
</html>
